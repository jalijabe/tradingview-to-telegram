name: ash

# AWS Automated Security Helper: the same `make ash-install ash` as locally. Findings at MEDIUM or above fail the
# job (config: .ash/.ash.yaml); SARIF goes to the repository's code-scanning alerts either way.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, so newly published CVEs surface without a code change
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ASH and its scanners (outside the scanned tree)
        run: make ash-install
      - name: Scan
        id: scan
        run: make ash
        continue-on-error: true
      - name: Job summary
        if: always()
        run: cat .ash/ash_output/reports/ash.summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('.ash/ash_output/reports/ash.ghas.sarif') != ''
        continue-on-error: true # private repos need GitHub Advanced Security for code scanning; the scan step decides
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .ash/ash_output/reports/ash.ghas.sarif
          category: ash
      - name: Keep the full reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-reports
          path: .ash/ash_output/reports
          retention-days: 30
      - name: Fail on findings
        if: steps.scan.outcome != 'success'
        run: |
          echo "::error::ASH reported actionable findings or an incomplete scan (see the job summary)."
          exit 1
