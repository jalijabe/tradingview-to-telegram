name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # matches the Lambda runtime
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make lint PY=python
      - run: make test PY=python
      - run: make graphs PY=python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mock-graphs
          path: out/mock-graphs

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
      - run: make tf-test

  observer-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the observer image (both variants)
        working-directory: observer
        run: |
          docker build -t tvtg-observer:test .
          docker build --build-arg WITH_AWS=1 -t tvtg-observer:aws .
      - name: Image runs and validates its config
        run: |
          docker run --rm tvtg-observer:test --help
          # Incomplete config must make `check` fail with exit code 1.
          code=0; docker run --rm -e TG_API_ID=1 tvtg-observer:test check || code=$?
          test "$code" -eq 1
          docker run --rm tvtg-observer:aws python -c "import boto3, telethon"

  plan-dev:
    # Runs once the AWS roles exist (docs/deploy.md step 1) and the repo variables are set.
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [python, terraform, observer-image]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_chat_id: ${{ vars.CHAT_ID }}
      TF_VAR_canary_chat_id: ${{ vars.CANARY_CHAT_ID }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_observer_host: ${{ vars.OBSERVER_HOST || 'none' }}
      TF_VAR_observer_region: ${{ vars.OBSERVER_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-west-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
      - working-directory: infra/envs/dev
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=tv-tg-bot/dev.tfstate"
          terraform plan -input=false -lock=false -no-color
