name: deploy

# push to main (or a manual run) -> dev; prod only after dev succeeds AND a reviewer approves the "prod" environment.
# Nothing runs until the AWS_DEPLOY_ROLE_ARN repo variable exists (docs/deploy.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  dev:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tf-apply.yml
    with:
      env: dev

  prod:
    needs: dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tf-apply.yml
    with:
      env: prod
