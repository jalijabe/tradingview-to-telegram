name: tf-apply

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

permissions: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_chat_id: ${{ vars.CHAT_ID }}
      TF_VAR_canary_chat_id: ${{ vars.CANARY_CHAT_ID }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_observer_host: ${{ vars.OBSERVER_HOST || 'none' }}
      TF_VAR_observer_region: ${{ vars.OBSERVER_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_ENV: ${{ inputs.env }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests gate the deploy
        working-directory: .
        run: pip install -q -r requirements-dev.txt && make test PY=python
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=tv-tg-bot/$TF_ENV.tfstate"
      - run: terraform apply -input=false -auto-approve -no-color
      - run: terraform output -no-color
